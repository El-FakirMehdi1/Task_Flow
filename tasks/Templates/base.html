{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet"
          href="{% static 'tasks/css/navbar.css' %}?v=2">

    <link rel="stylesheet"
          href="{% static 'tasks/css/home.css' %}?v=3">

    <link rel="stylesheet"
          href="{% static 'tasks/css/footer.css' %}?v=2">

    <link rel="stylesheet"
          href="{% static 'tasks/css/form.css' %}?v=2">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

{% include "parts/navbar.html" %}
{% if messages %}

    <div class="messages">

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    </div>

{% endif %}
<main class="container">

    {% block content %}

    {% endblock %}

</main>

{% include "parts/footer.html" %}
<script src="{% static 'tasks/js/home.js' %}"></script>
</body>

</html>
